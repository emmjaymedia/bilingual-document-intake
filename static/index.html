<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilingual Document Intake</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><strong>Bilingual Document Intake</strong><a href="/docs">API docs ↗</a></header><main><section class="intro"><h1>From scan to review.</h1><p>Extract invoice fields from English or Arabic images and validate the totals before approval.</p></section>
<div class="workspace"><section class="panel"><form id="intake"><label for="language">Invoice language</label><select id="language"><option value="en">English</option><option value="ar" lang="ar">العربية</option></select><label for="image">Invoice image</label><input id="image" type="file" accept="image/png,image/jpeg"><div class="actions"><button name="source" value="upload">Queue image</button> <button name="source" value="sample" class="secondary">Try sample</button></div></form><p id="status" role="status"></p>
<form id="review" hidden><h2>Review extracted fields</h2><label for="invoice_number">Invoice number</label><input id="invoice_number" required maxlength="40"><label for="subtotal">Subtotal</label><input id="subtotal" type="number" min="0" step=".01" required><label for="tax">Tax</label><input id="tax" type="number" min="0" step=".01" required><label for="total">Total</label><input id="total" type="number" min="0" step=".01" required><p></p><button>Approve invoice</button></form></section>
<aside><h2>Review queue</h2><label for="jobs">Pending documents</label><select id="jobs"></select><p><button id="load-job">Open selected document</button></p><h2>OCR output</h2><p>Compare the extracted text with your source. Use synthetic documents in this demo.</p><pre id="ocr" dir="auto" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></aside></div></main></body></html>
